<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16232A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Symptom Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16232A; --ink-2:#33474F; --muted:#6C8189; --hair:#D2DBD6;
  --paper:#E9EDEA; --surface:#FFFFFF; --surface-2:#F4F7F4;
  --teal:#12615C; --teal-ink:#0C4A46; --teal-wash:#DDEBE8;
  --plum:#7A3B5C; --plum-wash:#F0E2E9;
  --amber:#B0761F; --amber-wash:#F6ECD9;
  --r:14px; --r-sm:9px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --display:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--teal);outline-offset:2px;border-radius:4px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.hidden{display:none !important}

/* ---------- masthead ---------- */
header.top{
  background:var(--ink); color:#EAF0EC; padding:18px 0 15px;
  border-bottom:3px solid var(--teal);
}
header.top .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-.015em}
.brand em{font-style:normal;color:#8FC4BC}
.whoami{font-family:var(--mono);font-size:11px;color:#8CA5A0;text-align:right;line-height:1.3}
.linkish{background:none;border:0;padding:0;color:#8FC4BC;text-decoration:underline;
  text-underline-offset:2px;font-size:11px;font-family:var(--mono);cursor:pointer}

/* ---------- generic ---------- */
h2.sec{font-family:var(--display);font-weight:600;font-size:20px;margin:26px 0 3px;letter-spacing:-.01em}
p.sub{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:16px;margin-bottom:12px}
label.fl{display:block;font-size:12px;font-weight:600;letter-spacing:.055em;
  text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.field{margin-bottom:16px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],
input[type=password],textarea,select{
  width:100%;padding:12px 13px;border:1.5px solid var(--hair);border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--ink);
}
input:focus,textarea:focus,select:focus{border-color:var(--teal);background:#fff;outline:none}
textarea{resize:vertical;min-height:74px;line-height:1.5}
input[type=number]{font-family:var(--mono)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  padding:9px 13px;border:1.5px solid var(--hair);border-radius:999px;background:var(--surface-2);
  font-size:14px;cursor:pointer;user-select:none;transition:background .12s,border-color .12s,color .12s;
}
.chip[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:500}
.chip.sym[aria-pressed=true]{background:var(--plum);border-color:var(--plum)}
.scale{display:flex;gap:6px}
.scale .chip{flex:1;text-align:center;font-family:var(--mono);padding:11px 0}

/* per-symptom onset rows */
.onsethint{font-size:12.5px;color:var(--muted);margin:0 0 2px}
.onsetrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--hair)}
.onsetrow:last-child{border-bottom:0}
.onsetname{font-size:14px;flex:1;min-width:0}
.onsetinputs{display:flex;align-items:center;gap:5px;flex:none}
.onsetinputs input{width:50px;padding:8px 4px;text-align:center;font-family:var(--mono)}
.onsetsep{font-size:12px;color:var(--muted)}

/* toggle */
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 0;border-top:1px solid var(--hair)}
.toggle:first-of-type{border-top:0}
.toggle span{font-size:15px}
.sw{width:52px;height:31px;border-radius:999px;background:#CBD5CF;border:0;position:relative;
  cursor:pointer;flex:none;transition:background .16s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;
  background:#fff;transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.sw[aria-pressed=true]{background:var(--teal)}
.sw[aria-pressed=true]::after{transform:translateX(21px)}

/* buttons */
.btn{width:100%;padding:15px;border:0;border-radius:var(--r-sm);background:var(--teal);color:#fff;
  font-weight:600;font-size:16px;cursor:pointer;transition:background .13s}
.btn:active{background:var(--teal-ink)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.ghost:active{background:var(--teal-wash)}
.btn.sm{padding:11px;font-size:14px}
.btn.danger{background:transparent;color:#8C3A3A;border:1.5px solid #E0C4C4}

/* auto tags */
.autotags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;min-height:22px}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:4px 9px;border-radius:5px;
  background:var(--teal-wash);color:var(--teal-ink)}
.tag.none{background:transparent;color:var(--muted);padding-left:0}

/* entries */
.daygroup{margin-bottom:22px}
.dayhead{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding-bottom:7px;border-bottom:1px solid var(--hair);margin-bottom:11px}
.meal{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);
  padding:14px;margin-bottom:9px}
.meal.sym{border-left:4px solid var(--plum)}
.meal-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mcode{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.mtime{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.mfood{margin:7px 0 0;font-size:15px;line-height:1.45}
.symrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pill{font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--plum-wash);color:var(--plum);font-weight:500}
.pill.meta{background:var(--surface-2);color:var(--ink-2)}
.mactions{display:flex;gap:8px;margin-top:11px}
.mactions button{flex:1;padding:8px;font-size:13px;border-radius:7px;border:1px solid var(--hair);
  background:var(--surface-2);cursor:pointer}

/* glucose trace — the signature */
.trace{margin-top:11px;padding:11px 12px 8px;background:var(--amber-wash);border-radius:var(--r-sm)}
.trace-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--amber);margin-bottom:5px}
.trace svg{display:block;width:100%;height:auto}
.trace .pt{font-family:var(--mono);font-size:11px;font-weight:500;fill:var(--ink-2)}
.trace .pt.tm{font-size:9.5px;fill:var(--amber);font-weight:400}

/* symptom timeline */
.timeline{margin-top:11px;padding:11px 12px;background:var(--plum-wash);border-radius:var(--r-sm)}
.tl-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--plum);margin-bottom:6px}
.tl-row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13.5px;color:var(--ink)}
.tl-time{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);width:50px;flex:none;text-align:right}
.tl-dot{width:7px;height:7px;border-radius:50%;background:var(--plum);flex:none}
.tl-row.tl-meal{color:var(--muted)}
.tl-row.tl-meal .tl-dot{background:var(--muted)}
.tl-name{flex:1;min-width:0}

/* insights */
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;
  border-bottom:1px solid var(--hair)}
.stat:last-child{border-bottom:0}
.stat b{font-family:var(--mono);font-weight:600;font-size:19px}
.stat span{font-size:14px;color:var(--ink-2)}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
table.matrix{border-collapse:collapse;font-size:13px;min-width:100%}
table.matrix th,table.matrix td{padding:8px 7px;text-align:center;white-space:nowrap}
table.matrix th.rowh{text-align:left;font-weight:500;position:sticky;left:0;background:var(--surface);
  padding-right:12px;z-index:1}
table.matrix thead th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
  font-weight:600;vertical-align:bottom;line-height:1.25;white-space:normal;min-width:58px}
table.matrix tr.count td,table.matrix tr.count th{border-bottom:2px solid var(--ink);
  font-family:var(--mono);font-size:12px;color:var(--muted);padding-bottom:6px}
table.matrix td.v{font-family:var(--mono);line-height:1.15;padding:7px}
table.matrix td.v small{display:block;font-size:9.5px;opacity:.6;font-weight:400;margin-top:1px}
table.matrix .basecol{border-left:2px solid var(--hair);background:var(--surface-2)}
table.matrix thead th.basecol{color:var(--ink)}
table.matrix td.hi{background:var(--plum);color:#fff;border-radius:5px;font-weight:600}
table.matrix td.mid{background:var(--plum-wash);color:var(--plum);border-radius:5px}
table.matrix tr.base th,table.matrix tr.base td{color:var(--muted);font-size:11.5px;
  border-top:1px solid var(--hair)}
.legend{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.warn{background:var(--amber-wash);border-left:3px solid var(--amber);padding:11px 13px;
  border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:13.5px;color:#6B4A12;margin-bottom:14px}

/* symptom summary */
.sumcard{padding:14px 14px 8px}
.sumhead{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:9px;border-bottom:1px solid var(--hair);margin-bottom:4px}
.sumhead span{text-transform:none;letter-spacing:0;font-size:11px;opacity:.85}
.srow{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;
  padding:9px 4px;cursor:pointer;text-align:left;border-radius:7px}
.srow .sname{flex:none;width:118px;font-size:14px}
.srow .sbar{flex:1;height:7px;background:#EDF1EE;border-radius:99px;overflow:hidden}
.srow .sbar i{display:block;height:100%;background:var(--plum);border-radius:99px}
.srow .scount{flex:none;width:22px;text-align:right;font-family:var(--mono);font-size:14px;font-weight:600}
.srow.on{background:var(--plum);color:#fff}
.srow.on .sbar{background:rgba(255,255,255,.3)}
.srow.on .sbar i{background:#fff}
.srow.zero{opacity:.42;cursor:default}
.srow.zero .scount{font-weight:400}

/* filters */
.morebtn{width:100%;background:none;border:1.5px solid var(--hair);border-radius:var(--r-sm);
  padding:11px;font-size:14px;color:var(--ink-2);cursor:pointer;margin:12px 0 0}
.morebox{margin-top:12px}
.fgroup{margin-bottom:14px}
.flabel{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px}
.fchip{padding:8px 12px;border:1.5px solid var(--hair);border-radius:999px;background:var(--surface);
  font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.fchip b{font-family:var(--mono);font-weight:600;opacity:.6;margin-left:2px}
.fchip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.fchip.on b{opacity:.8}
.fbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 4px;
  padding:10px 13px;background:var(--teal-wash);border-radius:var(--r-sm);font-size:13.5px;
  color:var(--teal-ink)}
.fbar b{font-family:var(--mono)}
.fbar button{background:none;border:0;color:var(--teal-ink);text-decoration:underline;
  text-underline-offset:2px;font-size:13px;cursor:pointer;padding:0;flex:none}

/* entry rows */
.elist{margin-top:16px;background:var(--surface);border:1px solid var(--hair);
  border-radius:var(--r);overflow:hidden}
.elist .dayhead{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);background:var(--surface-2);padding:7px 13px;border-bottom:1px solid var(--hair);
  margin:0;position:sticky;top:0;z-index:2}
.erow{border-bottom:1px solid #EDF1EE}
.erow:last-child{border-bottom:0}
.erow.sym{box-shadow:inset 3px 0 0 var(--plum)}
.erow.open{background:var(--surface-2)}
.ehead{display:flex;gap:10px;align-items:baseline;width:100%;background:none;border:0;
  padding:11px 13px 3px;text-align:left;cursor:pointer}
.etime{flex:none;width:56px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.efood{flex:1;min-width:0;font-size:14.5px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow.open .efood{white-space:normal}
.ebits{display:flex;flex-wrap:wrap;gap:4px;padding:0 13px 11px 79px}
.mc{font-size:11.5px;background:var(--plum-wash);color:var(--plum);padding:3px 8px;
  border-radius:999px;font-weight:500}
.mm{font-size:11.5px;background:var(--surface-2);color:var(--ink-2);padding:3px 8px;border-radius:999px}
.erow.open .mm{background:#E7ECE8}
.mm.bg{background:var(--amber-wash);color:#7A5214}
.edet{padding:2px 13px 14px 13px;border-top:1px dashed var(--hair);margin-top:2px}
.efull{font-size:14.5px;margin:12px 0 10px;line-height:1.45}
.ekv{font-size:13.5px;margin:0 0 7px;color:var(--ink-2);line-height:1.45}
.ekv b{color:var(--ink);font-weight:600}

/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);
  backdrop-filter:blur(9px);border-top:1px solid var(--hair);display:flex;
  padding-bottom:env(safe-area-inset-bottom);z-index:40}
nav.tabs button{flex:1;background:none;border:0;padding:11px 4px 12px;cursor:pointer;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
  letter-spacing:.03em;font-weight:500}
nav.tabs button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=true]{color:var(--teal)}

/* auth */
.auth{max-width:390px;margin:52px auto;padding:0 20px}
.auth .card{padding:22px}
.auth h1{font-family:var(--display);font-size:27px;margin:0 0 5px;font-weight:600}
.auth p.lede{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.5}
.msg{padding:11px 13px;border-radius:var(--r-sm);font-size:13.5px;margin-bottom:14px;line-height:1.45}
.msg.err{background:#F7E4E4;color:#8C3A3A}
.msg.ok{background:var(--teal-wash);color:var(--teal-ink)}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty p{margin:0 0 16px;font-size:14.5px;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:12px 19px;border-radius:999px;font-size:14px;z-index:60;
  box-shadow:0 5px 20px rgba(0,0,0,.24);max-width:88vw;text-align:center}
.spin{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;display:inline-block;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* print */
#printroot{display:none}
@media print{
  body{background:#fff;padding:0}
  header.top,nav.tabs,#app,.toast{display:none !important}
  #printroot{display:block;padding:0;font-size:11pt}
  #printroot h1{font-family:var(--display);font-size:19pt;margin:0 0 3px}
  #printroot .meta{color:#555;font-size:9.5pt;margin-bottom:16px}
  #printroot h2{font-size:12.5pt;margin:17px 0 7px;border-bottom:1.5px solid #000;padding-bottom:3px}
  #printroot table{width:100%;border-collapse:collapse;font-size:8.8pt;margin-bottom:10px}
  #printroot th,#printroot td{border:1px solid #999;padding:3.5px 5px;text-align:left;vertical-align:top}
  #printroot th{background:#EEE;font-weight:600}
  #printroot .kv{display:flex;gap:26px;flex-wrap:wrap;font-size:10pt;margin-bottom:10px}
  #printroot .kv div{min-width:130px}
  #printroot .kv b{font-family:var(--mono)}
  @page{margin:14mm}
}
</style>
</head>
<body>

<div id="authview" class="auth hidden">
  <h1>Symptom Log</h1>
  <p class="lede">Meals, symptoms, and what your numbers do afterward. Private to your account.</p>
  <div class="card">
    <div id="authmsg"></div>
    <div class="field">
      <label class="fl" for="em">Email</label>
      <input type="email" id="em" autocomplete="email" inputmode="email">
    </div>
    <div class="field">
      <label class="fl" for="pw">Password</label>
      <input type="password" id="pw" autocomplete="current-password">
    </div>
    <button class="btn" id="signin">Sign in</button>
    <div style="height:9px"></div>
    <button class="btn ghost" id="signup">Create account</button>
  </div>
</div>

<div id="shell" class="hidden">
  <header class="top">
    <div class="wrap">
      <div class="brand">Symptom <em>Log</em></div>
      <div class="whoami"><span id="uemail"></span><br><button class="linkish" id="signout">Sign out</button></div>
    </div>
  </header>

  <main id="app" class="wrap"></main>

  <nav class="tabs">
    <button data-tab="add" aria-current="true">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
    <button data-tab="entries">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg>Entries</button>
    <button data-tab="reading">
      <svg viewBox="0 0 24 24"><path d="M3 15l4.5-6 4 4.5L15 7l6 8"/></svg>Reading</button>
    <button data-tab="insights">
      <svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Insights</button>
  </nav>
</div>

<div id="printroot"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

const SUPABASE_URL = "https://dgeqfwoutytuvzodmyhe.supabase.co";
const SUPABASE_KEY = "sb_publishable_RS8NgZt1QKoPb7uFa9jj1Q_S4Qq9anY";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------------- reference data ---------------- */
const SYMPTOMS = ["Racing heart","Urgent bowel movement","Sweating","Shakiness",
                  "Lightheaded","Bloating or cramping","Nausea","Fatigue"];
// Older entries were saved with shorthand labels; show them under the plain names.
const SYMPTOM_ALIASES = {"Urgency/BM":"Urgent bowel movement","Tired/Fatigued":"Fatigue",
                         "Bloating/Cramping":"Bloating or cramping"};
const normSymptoms = a => (a||[]).map(s=>SYMPTOM_ALIASES[s]||s);

const TRIGGERS = {
  "Caffeine":["coffee","espresso","latte","cappuccino","mocha","matcha","chai","cola","coke",
    "pepsi","dr pepper","soda","energy drink","sweet tea","iced tea","green tea","black tea","hot tea"],
  "Dairy":["cheese","milk","yogurt","cream","butter","queso","ranch","latte","custard","gelato"],
  "High-fat / fried":["fried","fries","chips","breaded","crispy","nugget","pizza","bacon",
    "empanada","sausage","burger","donut","tempura"],
  "Spicy":["spicy","hot sauce","jalapeno","jalapeño","sriracha","buffalo","chili","salsa",
    "cayenne","pepper jack","enchilada","curry"],
  "High-FODMAP":["onion","garlic","wheat","bread","sandwich","cracker","saltine","pizza","tortilla",
    "bagel","bun","toast","muffin","pastry","apple","pear","watermelon","mango","honey","bean",
    "lentil","chickpea","hummus","cauliflower","mushroom","asparagus","milk","yogurt","granola",
    "pasta","cereal","rye"],
  "Alcohol":["beer","wine","vodka","whiskey","bourbon","tequila","rum","cocktail","margarita mix",
    "hard seltzer","prosecco","champagne"],
  "Artificial sweetener":["diet ","sugar-free","sugar free","splenda","stevia","aspartame",
    "zero sugar","no sugar added","erythritol","xylitol","sorbitol"],
};
const DAIRY_NOT = ["non-dairy","non dairy","dairy-free","dairy free","vegan","oat milk","almond milk","soy milk"];

function autoTags(text){
  const t = (text||"").toLowerCase();
  if(!t.trim()) return [];
  const out=[];
  for(const [name,words] of Object.entries(TRIGGERS)){
    let hit = words.some(w=>t.includes(w));
    if(name==="Dairy" && hit && DAIRY_NOT.some(w=>t.includes(w))) hit=false;
    if(hit) out.push(name);
  }
  return out;
}

/* ---------------- state ---------------- */
let user=null, meals=[], readings=[], tab="add", editing=null;
let openMeal=null, showMore=false;
let onsetState={}; // symptom name -> onset minutes-after-eating, for the meal being added/edited
const filt={sym:new Set(), trig:new Set(), read:new Set()};

const $ = s=>document.querySelector(s);
const app = $("#app");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg,ms=2400){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d=document.createElement("div"); d.className="toast"; d.textContent=msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(),ms);
}
const pad=n=>String(n).padStart(2,"0");
function localDate(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function localTime(d){return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtDay(iso){
  const d=new Date(iso);
  return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
}
function fmtTime(iso){
  return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
// Minutes-after-eating -> "+1h 5m" / "+40m" / "+0m"
function fmtOnset(mins){
  if(mins==null) return "—";
  mins=Math.max(0,Math.round(mins));
  const h=Math.floor(mins/60), m=mins%60;
  if(h && m) return `+${h}h ${m}m`;
  if(h) return `+${h}h`;
  return `+${m}m`;
}
// Earliest per-symptom onset for a meal, falling back to the legacy single onset field.
function firstOnset(m){
  const evs=m.symptom_events;
  if(evs && evs.length) return Math.min(...evs.map(e=>e.onset_minutes??0));
  return m.onset_minutes;
}
// "Racing heart +5m, Nausea +40m" — falls back to the legacy free-text order for older entries.
function timelineText(m){
  if(m.symptom_events && m.symptom_events.length)
    return [...m.symptom_events].sort((a,b)=>a.onset_minutes-b.onset_minutes)
      .map(ev=>`${ev.name} ${fmtOnset(ev.onset_minutes)}`).join(", ");
  return m.symptom_order || "";
}
function nextCode(){
  let max=0;
  meals.forEach(m=>{const n=parseInt(String(m.meal_code).replace(/\D/g,""),10); if(n>max)max=n;});
  return "M"+String(max+1).padStart(3,"0");
}

/* ---------------- data ---------------- */
let loadError=null, loadSeq=0;

// Fetch without committing, so a stale in-flight request can't clobber fresh data.
async function fetchData(){
  try{
    const [m,r] = await Promise.all([
      sb.from("meals").select("*").order("eaten_at",{ascending:false}),
      sb.from("readings").select("*").order("taken_at",{ascending:true}),
    ]);
    if(m.error) throw m.error;
    if(r.error) throw r.error;
    return {
      meals:(m.data||[]).map(x=>({...x, symptoms:normSymptoms(x.symptoms)})),
      readings:r.data||[], error:null,
    };
  }catch(err){
    console.error("Symptom Log — load failed:", err);
    return {meals:[], readings:[], error: err?.message || String(err)};
  }
}

async function load(){
  const seq = ++loadSeq;
  const res = await fetchData();
  if(seq !== loadSeq) return;          // superseded by a newer load
  meals=res.meals; readings=res.readings; loadError=res.error;
}

const readingsFor = id => readings.filter(x=>x.meal_id===id)
  .sort((a,b)=>(a.minutes_after_eating??0)-(b.minutes_after_eating??0));

const pick = sel => {const c=document.querySelector(sel+" .chip[aria-pressed=true]"); return c?c.dataset.v:null};

async function saveMeal(){
  const btn=$("#save");

  const any=$("#f_any").getAttribute("aria-pressed")==="true";
  const sev=pick("#f_sev"), slp=pick("#f_sleep"), str=pick("#f_stress");
  const names=any?[...document.querySelectorAll("#f_symp .chip[aria-pressed=true]")].map(c=>c.dataset.v):[];
  const symptomEvents=names.map(n=>({name:n, onset_minutes:Math.max(0,onsetState[n]||0)}))
    .sort((a,b)=>a.onset_minutes-b.onset_minutes);
  const payload={
    user_id:user.id,
    eaten_at:dt.toISOString(),
    meal_type:pick("#f_type"),
    foods,
    large_portion:$("#f_big").getAttribute("aria-pressed")==="true",
    any_symptoms:any,
    onset_minutes:symptomEvents.length?symptomEvents[0].onset_minutes:null,
    duration_minutes:any?num($("#f_dur").value):null,
    severity:any&&sev?+sev:null,
    symptoms:names,
    symptom_events:symptomEvents,
    sleep_quality:slp?+slp:null,
    stress_level:str?+str:null,
    exercised:$("#f_ex").getAttribute("aria-pressed")==="true",
    notes:$("#f_notes").value.trim(),
  };
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>';
  let err;
  if(editing){
    ({error:err} = await sb.from("meals").update(payload).eq("id",editing.id));
  }else{
    payload.meal_code=nextCode();
    ({error:err} = await sb.from("meals").insert(payload));
  }
  btn.disabled=false;
  if(err){ btn.textContent=editing?"Save changes":"Save meal"; return toast("Didn't save: "+err.message,4200); }
  const was=editing; editing=null;
  await load();
  toast(was?"Meal updated":"Meal saved");
  tab = was ? "entries" : "add";
  render();
}

function trace(rs){
  const pts=rs.filter(r=>r.blood_sugar!=null);
  if(pts.length<1) return "";
  const VB_W=320, VB_H=76, PAD_X=30, PAD_T=20, PAD_B=17;
  const W=VB_W-PAD_X*2, H=VB_H-PAD_T-PAD_B;
  const xs=pts.map(p=>p.minutes_after_eating??0), ys=pts.map(p=>p.blood_sugar);
  const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const sx=v=>PAD_X+(x1===x0?W/2:((v-x0)/(x1-x0))*W);
  const sy=v=>PAD_T+(y1===y0?H/2:H-((v-y0)/(y1-y0))*H);
  const path=pts.map((p,i)=>`${i?"L":"M"}${sx(p.minutes_after_eating??0).toFixed(1)},${sy(p.blood_sugar).toFixed(1)}`).join(" ");
  const dots=pts.map(p=>`<circle cx="${sx(p.minutes_after_eating??0).toFixed(1)}" cy="${sy(p.blood_sugar).toFixed(1)}" r="3.4" fill="#B0761F"/>`).join("");
  const labs=pts.map(p=>{
    const x=sx(p.minutes_after_eating??0), y=sy(p.blood_sugar);
    return `<text class="pt" x="${x.toFixed(1)}" y="${(y-9).toFixed(1)}" text-anchor="middle">${p.blood_sugar}</text>
            <text class="pt tm" x="${x.toFixed(1)}" y="${(VB_H-4).toFixed(1)}" text-anchor="middle">${p.minutes_after_eating??0}m</text>`;
  }).join("");
  const delta = pts.length>1 ? (pts[pts.length-1].blood_sugar-pts[0].blood_sugar) : null;
  return `<div class="trace">
    <div class="trace-h">Blood sugar${delta!==null?` &middot; ${delta>0?"+":""}${delta} over ${(xs[xs.length-1]-xs[0])} min`:""}</div>
    <svg viewBox="0 0 ${VB_W} ${VB_H}" role="img" aria-label="Blood sugar readings after this meal">
      ${pts.length>1?`<path d="${path}" fill="none" stroke="#B0761F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`:""}
      ${dots}${labs}
    </svg></div>`;
}

function timelineHTML(m){
  const evs=[...m.symptom_events].sort((a,b)=>a.onset_minutes-b.onset_minutes);
  const rows=evs.map(ev=>`<div class="tl-row">
      <span class="tl-time">${fmtOnset(ev.onset_minutes)}</span>
      <span class="tl-dot"></span>
      <span class="tl-name">${esc(ev.name)}</span>
    </div>`).join("");
  return `<div class="timeline">
    <div class="tl-h">Timeline</div>
    <div class="tl-row tl-meal"><span class="tl-time">0:00</span><span class="tl-dot"></span><span class="tl-name">Meal eaten</span></div>
    ${rows}
  </div>`;
}

const TRIGGER_NAMES = Object.keys(TRIGGERS).concat(["Large portion"]);
function mealFactors(m){
  const t = autoTags(m.foods);
  if(m.large_portion) t.push("Large portion");
  return t;
}
function bgSeries(id){ return readingsFor(id).filter(r=>r.blood_sugar!=null); }
function bgRose(id){ const s=bgSeries(id); return s.length>1 && s[s.length-1].blood_sugar>s[0].blood_sugar; }

const READING_FILTERS = {
  "Blood sugar recorded": m => bgSeries(m.id).length>0,
  "Blood sugar went up":  m => bgRose(m.id),
  "Pulse recorded":       m => readingsFor(m.id).some(r=>r.pulse!=null),
  "Blood pressure recorded": m => readingsFor(m.id).some(r=>r.bp_systolic!=null),
};

function matchesFilters(m){
  if(filt.sym.size && !(m.symptoms||[]).some(s=>filt.sym.has(s))) return false;
  if(filt.trig.size){ const f=mealFactors(m); if(!f.some(x=>filt.trig.has(x))) return false; }
  if(filt.read.size && ![...filt.read].some(k=>READING_FILTERS[k](m))) return false;
  return true;
}
function anyFilters(){ return filt.sym.size+filt.trig.size+filt.read.size > 0; }

function viewEntries(){
  if(!meals.length){
    app.innerHTML=`<h2 class="sec">Entries</h2>
      <div class="empty"><p>No meals logged yet. Every meal counts here, symptoms or not.</p>
      <button class="btn ghost" id="goadd">Log your first meal</button></div>`;
    $("#goadd").onclick=()=>document.querySelector('[data-tab=add]').click();
    return;
  }

  const symCount = s => meals.filter(m=>(m.symptoms||[]).includes(s)).length;
  const counts = SYMPTOMS.map(symCount);
  const maxCount = Math.max(1,...counts);
  const shown = meals.filter(matchesFilters);

  const symRows = SYMPTOMS.map((s,i)=>{
    const n=counts[i], on=filt.sym.has(s);
    return `<button class="srow${n?"":" zero"}${on?" on":""}" data-sym="${esc(s)}" ${n?"":"disabled"}
             aria-pressed="${on}">
      <span class="sname">${esc(s)}</span>
      <span class="sbar"><i style="width:${n? Math.max(6,(n/maxCount)*100):0}%"></i></span>
      <span class="scount">${n}</span></button>`;
  }).join("");

  const trigChips = TRIGGER_NAMES.map(t=>{
    const n=meals.filter(m=>mealFactors(m).includes(t)).length;
    if(!n) return "";
    return `<button class="fchip${filt.trig.has(t)?" on":""}" data-trig="${esc(t)}"
             aria-pressed="${filt.trig.has(t)}">${esc(t)} <b>${n}</b></button>`;
  }).join("");

  const readChips = Object.keys(READING_FILTERS).map(k=>{
    const n=meals.filter(READING_FILTERS[k]).length;
    if(!n) return "";
    return `<button class="fchip${filt.read.has(k)?" on":""}" data-read="${esc(k)}"
             aria-pressed="${filt.read.has(k)}">${esc(k)} <b>${n}</b></button>`;
  }).join("");

  const groups={};
  shown.forEach(m=>{(groups[fmtDay(m.eaten_at)] ||= []).push(m)});

  const list = Object.entries(groups).map(([day,ms])=>`
    <div class="dayhead">${day}</div>
    ${ms.map(m=>{
      const open = openMeal===m.id;
      const rs=readingsFor(m.id), bs=bgSeries(m.id);
      const bits=[];
      (m.symptoms||[]).forEach(s=>bits.push(`<span class="mc">${esc(s)}</span>`));
      const fo=firstOnset(m);
      if(fo!=null) bits.push(`<span class="mm">started ${fmtOnset(fo)}</span>`);
      if(m.severity!=null) bits.push(`<span class="mm">severity ${m.severity} of 5</span>`);
      if(bs.length>1) bits.push(`<span class="mm bg">blood sugar ${bs[0].blood_sugar} → ${bs[bs.length-1].blood_sugar}</span>`);
      else if(bs.length===1) bits.push(`<span class="mm bg">blood sugar ${bs[0].blood_sugar}</span>`);
      return `<div class="erow${m.any_symptoms?" sym":""}${open?" open":""}">
        <button class="ehead" data-open="${m.id}" aria-expanded="${open}">
          <span class="etime">${fmtTime(m.eaten_at)}</span>
          <span class="efood">${esc(m.foods)}</span>
        </button>
        ${bits.length?`<div class="ebits">${bits.join("")}</div>`:""}
        ${open?`<div class="edet">
          <p class="efull">${esc(m.foods)}</p>
          ${m.meal_type?`<p class="ekv"><b>Meal</b> ${esc(m.meal_type)}${m.large_portion?" · large portion":""}</p>`:""}
          ${mealFactors(m).length?`<div class="autotags">${mealFactors(m).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
          ${(m.symptom_events&&m.symptom_events.length>1)?timelineHTML(m)
            :(m.symptom_order?`<p class="ekv"><b>What happened</b> ${esc(m.symptom_order)}</p>`:"")}
          ${m.duration_minutes!=null?`<p class="ekv"><b>Lasted</b> ${m.duration_minutes} min</p>`:""}
          ${m.sleep_quality!=null?`<p class="ekv"><b>Sleep the night before</b> ${m.sleep_quality} of 5</p>`:""}
          ${m.stress_level!=null?`<p class="ekv"><b>Stress that day</b> ${m.stress_level} of 5</p>`:""}
          ${m.notes?`<p class="ekv"><b>Notes</b> ${esc(m.notes)}</p>`:""}
          ${trace(rs)}
          ${rs.filter(r=>r.pulse!=null||r.bp_systolic!=null).map(r=>
            `<p class="ekv"><b>${r.minutes_after_eating??0} min after eating</b> ${
              [r.pulse!=null?r.pulse+" bpm":"", r.bp_systolic!=null?`${r.bp_systolic}/${r.bp_diastolic??"?"} mmHg`:""]
              .filter(Boolean).join(" · ")}</p>`).join("")}
          <div class="mactions">
            <button data-edit="${m.id}">Edit</button>
            <button data-del="${m.id}">Delete</button>
          </div></div>`:""}
      </div>`}).join("")}`).join("");

  app.innerHTML=`
    <h2 class="sec">Entries</h2>
    <p class="sub">${meals.length} meals logged &middot; ${readings.length} readings taken</p>

    <div class="card sumcard">
      <div class="sumhead">Symptoms so far <span>tap to filter</span></div>
      ${symRows}
    </div>

    <button class="morebtn" id="more" aria-expanded="${showMore}">
      ${showMore?"Fewer filters":"More filters"}</button>
    <div class="morebox${showMore?"":" hidden"}">
      ${trigChips?`<div class="fgroup"><div class="flabel">What was in the meal</div>
        <div class="chips">${trigChips}</div></div>`:""}
      ${readChips?`<div class="fgroup"><div class="flabel">Readings</div>
        <div class="chips">${readChips}</div></div>`:""}
    </div>

    ${anyFilters()?`<div class="fbar">
      <span>Showing <b>${shown.length}</b> of ${meals.length} meals</span>
      <button id="clearf">Clear filters</button></div>`:""}

    <div class="elist">${shown.length?list:`<div class="empty"><p>No meals match those filters.</p></div>`}</div>
    <div style="height:26px"></div>`;

  app.querySelectorAll("[data-sym]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.sym; filt.sym.has(v)?filt.sym.delete(v):filt.sym.add(v); viewEntries();
  });
  app.querySelectorAll("[data-trig]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.trig; filt.trig.has(v)?filt.trig.delete(v):filt.trig.add(v); viewEntries();
  });
  app.querySelectorAll("[data-read]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.read; filt.read.has(v)?filt.read.delete(v):filt.read.add(v); viewEntries();
  });
  if($("#more")) $("#more").onclick=()=>{ showMore=!showMore; viewEntries(); };
  if($("#clearf")) $("#clearf").onclick=()=>{
    filt.sym.clear(); filt.trig.clear(); filt.read.clear(); viewEntries();
  };
  app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    openMeal = openMeal===b.dataset.open ? null : b.dataset.open; viewEntries();
  });
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    editing=meals.find(m=>m.id===b.dataset.edit); tab="add"; render();
    document.querySelectorAll("nav.tabs button").forEach(x=>
      x.setAttribute("aria-current", x.dataset.tab==="add"));
  });
  app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    const m=meals.find(x=>x.id===b.dataset.del);
    if(!confirm(`Delete this meal and its readings?\n\n${fmtDay(m.eaten_at)} ${fmtTime(m.eaten_at)} — ${m.foods}`)) return;
    const {error}=await sb.from("meals").delete().eq("id",m.id);
    if(error) return toast("Couldn't delete: "+error.message);
    openMeal=null; await load(); toast("Deleted"); render();
  });
}

/* ================= INSIGHTS ================= */
function stats(){
  const total=meals.length, sym=meals.filter(m=>m.any_symptoms);
  const avg=(a)=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const has=(m,name)=> name==="Large portion" ? m.large_portion : autoTags(m.foods).includes(name);
  const grid=Object.keys(TRIGGERS).concat(["Large portion"]).map(name=>({
    name,
    cells:SYMPTOMS.map(s=>{
      const withS=meals.filter(m=>(m.symptoms||[]).includes(s));
      if(!withS.length) return null;
      const hit=withS.filter(m=>has(m,name)).length;
      return {pct:hit/withS.length, hit, of:withS.length};
    }),
    base: total ? meals.filter(m=>has(m,name)).length/total : 0,
    baseN: meals.filter(m=>has(m,name)).length,
  }));
  return {total, symCount:sym.length,
    pct: total? sym.length/total : 0,
    onset: avg(sym.map(firstOnset).filter(v=>v!=null)),
    sev: avg(sym.map(m=>m.severity).filter(v=>v!=null)),
    counts: SYMPTOMS.map(s=>meals.filter(m=>(m.symptoms||[]).includes(s)).length),
    grid,
    bgAll: readings.map(r=>r.blood_sugar).filter(v=>v!=null),
  };
}

function viewInsights(){
  const s=stats();
  if(!s.total){ app.innerHTML=`<h2 class="sec">Insights</h2>
    <div class="empty"><p>Log a few meals and this fills in.</p></div>`; return; }
  const pc=v=>v==null?"—":Math.round(v*100)+"%";
  const thin = s.symCount<8;
  app.innerHTML=`
    <h2 class="sec">Insights</h2>
    <p class="sub">Built from ${s.total} meals and ${readings.length} readings.</p>
    ${thin?`<div class="warn">Only ${s.symCount} symptom meal${s.symCount===1?"":"s"} so far. Percentages below will swing wildly until there are more — treat them as placeholders, not findings.</div>`:""}

    <div class="card">
      <div class="stat"><span>Meals logged</span><b>${s.total}</b></div>
      <div class="stat"><span>Meals with symptoms</span><b>${s.symCount}</b></div>
      <div class="stat"><span>Share with symptoms</span><b>${pc(s.pct)}</b></div>
      <div class="stat"><span>Typical onset</span><b>${fmtOnset(s.onset)}</b></div>
      <div class="stat"><span>Typical severity</span><b>${s.sev==null?"—":s.sev.toFixed(1)}</b></div>
    </div>

    <h2 class="sec">What was in those meals</h2>
    <p class="sub">Read down a symptom column, then compare across to that row's All meals figure on the right.</p>
    <div class="card" style="padding:14px 16px">
      <div class="gridwrap"><table class="matrix">
        <thead><tr><th class="rowh"></th>${SYMPTOMS.map(x=>`<th>${x.replace("/"," / ")}</th>`).join("")}<th class="basecol">All meals</th></tr></thead>
        <tbody>
          <tr class="count"><th class="rowh">Meals with it</th>${s.counts.map(c=>`<td>${c}</td>`).join("")}<td>${s.total}</td></tr>
          ${s.grid.map(rw=>`<tr><th class="rowh">${rw.name}</th>${rw.cells.map(c=>{
            if(c==null) return `<td class="v">—</td>`;
            const lift = c.pct - rw.base;
            const solid = c.hit>=3;                       // needs real meals behind it
            const cls = solid&&lift>=0.25 ? "hi" : (solid&&lift>=0.12 ? "mid" : "");
            return `<td class="v ${cls}">${Math.round(c.pct*100)}%<small>${c.hit}/${c.of}</small></td>`;
          }).join("")}<td class="v basecol">${Math.round(rw.base*100)}%<small>${rw.baseN}/${s.total}</small></td></tr>`).join("")}
        </tbody></table></div>
      <p class="legend">Each cell shows the share, with the actual meal counts beneath it. A cell is highlighted only when it sits well above that row's <b>All meals</b> figure <em>and</em> rests on at least 3 meals. Nothing highlighted means nothing has separated from noise yet.</p>
    </div>

    ${s.bgAll.length?`
    <h2 class="sec">Blood sugar</h2>
    <div class="card">
      <div class="stat"><span>Readings</span><b>${s.bgAll.length}</b></div>
      <div class="stat"><span>Range</span><b>${Math.min(...s.bgAll)}–${Math.max(...s.bgAll)}</b></div>
      <div class="stat"><span>Average</span><b>${Math.round(s.bgAll.reduce((a,b)=>a+b,0)/s.bgAll.length)}</b></div>
    </div>`:""}

    <h2 class="sec">For your appointment</h2>
    <div class="card">
      <button class="btn ghost sm" id="csv1">Download meals CSV</button><div style="height:8px"></div>
      <button class="btn ghost sm" id="csv2">Download readings CSV</button><div style="height:8px"></div>
      <button class="btn sm" id="print">Print summary</button>
    </div>
    <div style="height:26px"></div>`;
  $("#csv1").onclick=()=>csvMeals();
  $("#csv2").onclick=()=>csvReadings();
  $("#print").onclick=()=>printSummary();
}

/* ================= EXPORT ================= */
function dl(name,text){
  const b=new Blob([text],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast("Downloaded "+name);
}
const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
function csvMeals(){
  const head=["Date","Time","Type","Foods","Large portion","Symptoms?","Onset (min)",
    "Duration (min)","Severity","Symptoms","Timeline","Sleep","Stress","Exercised","Notes",
    ...Object.keys(TRIGGERS)];
  const rows=[...meals].reverse().map(m=>{
    const t=autoTags(m.foods), d=new Date(m.eaten_at);
    return [d.toLocaleDateString(),d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}),
      m.meal_type,m.foods,m.large_portion?"Y":"N",m.any_symptoms?"Y":"N",firstOnset(m),
      m.duration_minutes,m.severity,(m.symptoms||[]).join("; "),timelineText(m),
      m.sleep_quality,m.stress_level,m.exercised?"Y":"N",m.notes,
      ...Object.keys(TRIGGERS).map(k=>t.includes(k)?"Y":"N")].map(q).join(",");
  });
  dl("meals.csv",[head.map(q).join(","),...rows].join("\n"));
}
function csvReadings(){
  const head=["Date","Time","Meal eaten","Minutes after eating","Blood sugar","Pulse",
    "BP systolic","BP diastolic","Meal had symptoms","Notes"];
  const rows=readings.map(r=>{
    const m=meals.find(x=>x.id===r.meal_id)||{}, d=new Date(r.taken_at);
    return [d.toLocaleDateString(),
      d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}),m.foods,
      r.minutes_after_eating,r.blood_sugar,r.pulse,r.bp_systolic,r.bp_diastolic,
      m.any_symptoms?"Y":"N",r.notes].map(q).join(",");
  });
  dl("readings.csv",[head.map(q).join(","),...rows].join("\n"));
}

function printSummary(){
  const s=stats(), pc=v=>v==null?"—":Math.round(v*100)+"%";
  const span = meals.length
    ? `${new Date(meals[meals.length-1].eaten_at).toLocaleDateString()} – ${new Date(meals[0].eaten_at).toLocaleDateString()}`
    : "—";
  const symMeals=[...meals].reverse().filter(m=>m.any_symptoms);
  $("#printroot").innerHTML=`
    <h1>Symptom Log — summary</h1>
    <div class="meta">${span} &middot; ${s.total} meals, ${s.symCount} with symptoms &middot; printed ${new Date().toLocaleDateString()}</div>

    <div class="kv">
      <div>Meals logged<br><b>${s.total}</b></div>
      <div>With symptoms<br><b>${s.symCount} (${pc(s.pct)})</b></div>
      <div>Typical onset<br><b>${fmtOnset(s.onset)}</b></div>
      <div>Typical severity<br><b>${s.sev==null?"—":s.sev.toFixed(1)+" / 5"}</b></div>
    </div>

    <h2>Symptom frequency</h2>
    <table><tr><th>Symptom</th><th>Meals</th></tr>
      ${SYMPTOMS.map((x,i)=>`<tr><td>${x}</td><td>${s.counts[i]}</td></tr>`).join("")}</table>

    <h2>Food factors in symptom meals</h2>
    <table>
      <tr><th>Factor</th>${SYMPTOMS.map((x,i)=>`<th>${x}<br>(n=${s.counts[i]})</th>`).join("")}<th>All meals<br>(n=${s.total})</th></tr>
      ${s.grid.map(rw=>`<tr><td>${rw.name}</td>${rw.cells.map(c=>
        `<td>${c==null?"—":Math.round(c.pct*100)+"% <small>("+c.hit+"/"+c.of+")</small>"}</td>`).join("")}<td>${Math.round(rw.base*100)}% <small>(${rw.baseN}/${s.total})</small></td></tr>`).join("")}
    </table>

    ${readings.length?`<h2>Readings</h2>
    <table><tr><th>Date</th><th>Meal eaten</th><th>Min after eating</th><th>Blood sugar</th><th>Pulse</th><th>BP</th></tr>
      ${readings.map(r=>{const m=meals.find(x=>x.id===r.meal_id)||{};
        return `<tr><td>${new Date(r.taken_at).toLocaleDateString()}</td><td>${esc((m.foods||"—").slice(0,44))}</td>
        <td>${r.minutes_after_eating??"—"}</td><td>${r.blood_sugar??"—"}</td><td>${r.pulse??"—"}</td>
        <td>${r.bp_systolic?`${r.bp_systolic}/${r.bp_diastolic??"?"}`:"—"}</td></tr>`}).join("")}
    </table>`:""}

    <h2>Symptom episodes in detail</h2>
    <table>
      <tr><th>Date / time</th><th>Foods</th><th>Timeline</th><th>Sev</th><th>Notes</th></tr>
      ${symMeals.map(m=>`<tr>
        <td>${new Date(m.eaten_at).toLocaleDateString()}<br>${fmtTime(m.eaten_at)}</td>
        <td>${esc(m.foods)}</td>
        <td>${esc(timelineText(m))||"—"}</td>
        <td>${m.severity??"—"}</td>
        <td>${esc(m.notes||"")}</td></tr>`).join("")}
    </table>`;
  window.print();
}

/* ================= shell ================= */
function errorPanel(msg,detail){
  return `<h2 class="sec">Something went wrong</h2>
    <div class="card" style="border-color:#E0C4C4">
      <p style="margin:0 0 10px;font-size:15px">${esc(msg)}</p>
      ${detail?`<p style="margin:0 0 14px;font-family:var(--mono);font-size:12px;color:var(--muted);
        word-break:break-word">${esc(detail)}</p>`:""}
      <button class="btn ghost sm" id="retry">Try again</button>
    </div>`;
}
function render(){
  try{
    if(loadError){
      app.innerHTML=errorPanel(
        "Couldn't reach your data. Your entries are safe on the server — this is a connection problem.",
        loadError);
      $("#retry").onclick=async()=>{ await load(); render(); };
      return;
    }
    if(tab==="add") viewAdd();
    else if(tab==="entries") viewEntries();
    else if(tab==="reading") viewReading();
    else viewInsights();
  }catch(err){
    console.error("Symptom Log — render failed on tab:", tab, err);
    app.innerHTML=errorPanel("This screen hit an error while drawing.", (err&&err.message)||String(err));
    $("#retry").onclick=()=>render();
  }
  window.scrollTo(0,0);
}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-current",x===b));
  if(b.dataset.tab!=="add") editing=null;
  tab=b.dataset.tab; render();
});

/* auth */
function authMsg(t,cls="err"){ $("#authmsg").innerHTML = t?`<div class="msg ${cls}">${esc(t)}</div>`:"" }
$("#signin").onclick=async()=>{
  authMsg("");
  const {error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});
  if(error) authMsg(error.message);
};
$("#signup").onclick=async()=>{
  authMsg("");
  const email=$("#em").value.trim(), password=$("#pw").value;
  if(!email||password.length<6) return authMsg("Enter an email and a password of at least 6 characters.");
  const {data,error}=await sb.auth.signUp({email,password});
  if(error) return authMsg(error.message);
  if(data.session) return;
  authMsg("Account created. Check your email to confirm, then sign in.","ok");
};
$("#signout").onclick=()=>sb.auth.signOut();

let bootSeq=0, painted=false;
async function boot(session){
  const seq = ++bootSeq;
  if(!session){
    user=null; meals=[]; readings=[]; painted=false;
    $("#shell").classList.add("hidden");
    $("#authview").classList.remove("hidden");
    return;
  }
  user=session.user;
  $("#uemail").textContent=user.email;
  $("#authview").classList.add("hidden");
  $("#shell").classList.remove("hidden");
  if(!painted){
    app.innerHTML=`<div class="empty"><p><span class="spin"
      style="border-color:rgba(0,0,0,.15);border-top-color:var(--teal)"></span>
      Loading your entries…</p></div>`;
  }
  await load();
  // A newer boot supersedes this one only once something is actually on screen.
  if(seq !== bootSeq && painted) return;
  if(!meals.length && !loadError) tab="entries";
  document.querySelectorAll("nav.tabs button").forEach(x=>
    x.setAttribute("aria-current", x.dataset.tab===tab));
  render();
  painted = true;
}

let sawAuthEvent=false;
sb.auth.onAuthStateChange((event,session)=>{
  sawAuthEvent=true;
  // Token refreshes don't change what's displayed; re-booting on them
  // just cancels whatever load is in flight.
  if(painted && session && (event==="TOKEN_REFRESHED" || event==="USER_UPDATED")) return;
  boot(session);
});

// Fallback only if no auth event ever arrives (older clients don't emit INITIAL_SESSION).
setTimeout(async()=>{
  if(sawAuthEvent) return;
  try{
    const {data}=await sb.auth.getSession();
    boot(data?.session||null);
  }catch(err){
    console.error("Symptom Log — auth check failed:", err);
    $("#shell").classList.remove("hidden");
    app.innerHTML=errorPanel("Couldn't check whether you're signed in.",(err&&err.message)||String(err));
  }
}, 700);
</script>
